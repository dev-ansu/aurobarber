<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="48" fill="url(#bgGrad)" />
  <rect width="396" height="396" x="2" y="2" rx="46" fill="none" stroke="#334155" stroke-width="2" />
  
  <!-- Subtle Amber Glow Circle -->
  <circle cx="200" cy="185" r="110" fill="url(#glowGrad)" />

  <!-- Badge Container -->
  <rect x="135" y="120" width="130" height="130" rx="32" fill="#1e293b" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3" filter="url(#shadow)" />

  <!-- Graduation Cap Icon (Capelo) -->
  <g transform="translate(150, 135)">
    <!-- Cap Top (Diamond) -->
    <path d="M50 14 L95 38 L50 62 L5 38 Z" fill="url(#goldGrad)" />
    <!-- Cap Underneath Base -->
    <path d="M22 47.5 L22 72 C22 84 78 84 78 72 L78 47.5 L50 62 Z" fill="#b45309" opacity="0.9" />
    <path d="M25 50 C32 60 68 60 75 50 L75 70 C75 80 25 80 25 70 Z" fill="url(#goldGrad)" />
    <!-- Tassel / Cord -->
    <path d="M50 38 L90 56 L90 82" fill="none" stroke="#fef3c7" stroke-width="3" stroke-linecap="round" />
    <!-- Tassel Tip -->
    <circle cx="90" cy="84" r="4" fill="#fef3c7" />
    <path d="M87 86 L93 86 L92 98 L88 98 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Label Text -->
  <text x="200" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#f8fafc" letter-spacing="3">
    FORMAÇÃO
  </text>
  <text x="200" y="325" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f59e0b" letter-spacing="1.5">
    PROFISSIONAL
  </text>
</svg>
